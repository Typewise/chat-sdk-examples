version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      chat-sdk:
        patterns:
          - '@typewise/chat-sdk'
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@typewise/chat-sdk'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
